# /etc/nginx/sites-available/absensi  (symlink ke sites-enabled)
# SSL ditambahkan otomatis oleh: certbot --nginx -d absensi.pandawaamerta.co.id

# Batas laju login: 10 request/menit per IP (ditaruh di level http via include conf.d)
limit_req_zone $binary_remote_addr zone=absensi_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=absensi_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name absensi.pandawaamerta.co.id;

    client_max_body_size 4m;
    server_tokens off;

    location = /api/auth/login {
        limit_req zone=absensi_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/absensi-proxy.conf;
    }

    location /api/ {
        limit_req zone=absensi_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/absensi-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/absensi-proxy.conf;
    }
}
