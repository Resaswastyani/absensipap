# /etc/nginx/sites-available/absensi  (symlink ke sites-enabled)
# Zona rate-limit ada di deploy/absensi-ratelimit.conf -> /etc/nginx/conf.d/

server {
    server_name absensi.pandawaamerta.co.id;

    client_max_body_size 4m;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location = /api/auth/login {
        limit_req zone=absensi_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/absensi-proxy.conf;
    }

    location /api/ {
        limit_req zone=absensi_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/absensi-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/absensi-proxy.conf;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/absensi.pandawaamerta.co.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/absensi.pandawaamerta.co.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = absensi.pandawaamerta.co.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name absensi.pandawaamerta.co.id;
    return 404; # managed by Certbot
}
